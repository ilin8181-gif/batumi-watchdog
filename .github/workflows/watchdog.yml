name: watchdog

# Cloud website watchdog — runs in GitHub Actions 24/7,
# independent of whether any local machine is on.
# Telegram alert fires only on a status change (down / back up).
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — fits the free 2000 min/mo quota (GitHub may delay by a few minutes)
  workflow_dispatch:          # manual run via the Actions tab

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # rolling state: restore the last state so we alert only on a
      # status *change* (down / back up), not on every run.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: watchdog-state-${{ github.run_id }}
          restore-keys: |
            watchdog-state-

      - name: Run watchdog
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 watchdog_ci.py
